<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep Obsidian Lacquer with subtle violet vignette -->
    <radialGradient id="bgTile" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#190518" />
      <stop offset="60%" stop-color="#0B020B" />
      <stop offset="100%" stop-color="#030004" />
    </radialGradient>

    <!-- Deep Ambient Blossom Bloom -->
    <radialGradient id="bloomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1A5E" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#FF1A5E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF1A5E" stop-opacity="0" />
    </radialGradient>

    <!-- Facet 1: Neon Crimson Highlight (Razor Katana edge) -->
    <linearGradient id="facetNeon" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FF3878" />
      <stop offset="55%" stop-color="#FF145E" />
      <stop offset="100%" stop-color="#B80036" />
    </linearGradient>

    <!-- Facet 2: Deep Velvet Crimson Shading -->
    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#BA0038" />
      <stop offset="55%" stop-color="#800022" />
      <stop offset="100%" stop-color="#480012" />
    </linearGradient>

    <!-- Metallic Gold Inlay -->
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#E5A100" />
    </linearGradient>

    <!-- Single Master Petal Unit:
         Spans full breadth for bold silhouette.
         Center base: +-1.5 at y=-42.
         Lower shoulder: +-56 at y=-88.
         Mid shoulder: +-92 at y=-145.
         Tip peak: +-44 at y=-208.
         Notch cleft: +-1.5 at y=-188.
    -->
    <g id="masterPetal">
      <!-- Left Facet (Dark Velvet) -->
      <polygon points="-1.5,-44  -54,-88  -92,-145  -44,-208  -1.5,-188" 
               fill="url(#facetDeep)" 
               stroke="#260009" 
               stroke-width="0.8" />

      <!-- Right Facet (Electric Neon Sakura) -->
      <polygon points="1.5,-44  54,-88  92,-145  44,-208  1.5,-188" 
               fill="url(#facetNeon)" 
               stroke="#FF598C" 
               stroke-width="0.8" />

      <!-- Center Katana Spine Crease (Negative Space / Razor Highlight) -->
      <line x1="0" y1="-44" x2="0" y2="-188" stroke="#FFA3C2" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

      <!-- Origami Fold Crease: from base to outer peak -->
      <line x1="-1.5" y1="-44" x2="-44" y2="-208" stroke="#5E0018" stroke-width="0.6" opacity="0.5" />
      <line x1="1.5" y1="-44" x2="44" y2="-208" stroke="#FFC2D6" stroke-width="0.6" opacity="0.5" />
    </g>
  </defs>

  <!-- 1. Background Squircle Canvas with Double Precision Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgTile)" stroke="#330820" stroke-width="2.5" />
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="#FF145E" stroke-opacity="0.12" stroke-width="1.2" />

  <!-- 2. Sacred Japanese Clan Crest (Maru) Framing Rings -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FF145E" stroke-opacity="0.15" stroke-width="1" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="#FF145E" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="32 10 6 10" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="#FF145E" stroke-opacity="0.2" stroke-width="1" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="#FF145E" stroke-opacity="0.08" stroke-width="1" />

  <!-- 3. Soft Ambient Core Bloom -->
  <circle cx="256" cy="256" r="185" fill="url(#bloomGlow)" />

  <!-- 4. Radial 5-Petal Dark Sakura Assembly -->
  <g transform="translate(256, 256)">
    <!-- 5 Master Origami Petals at 72 deg intervals -->
    <use href="#masterPetal" transform="rotate(0)" />
    <use href="#masterPetal" transform="rotate(72)" />
    <use href="#masterPetal" transform="rotate(144)" />
    <use href="#masterPetal" transform="rotate(216)" />
    <use href="#masterPetal" transform="rotate(288)" />

    <!-- 5. Minimalist Clan Mon Center Hub -->
    <circle cx="0" cy="0" r="44" fill="#0A020A" stroke="#FF145E" stroke-width="2.5" />
    <circle cx="0" cy="0" r="37" fill="none" stroke="#500015" stroke-width="1.5" />
    <circle cx="0" cy="0" r="28" fill="#180312" stroke="#FF145E" stroke-width="1.5" stroke-opacity="0.85" />
    <circle cx="0" cy="0" r="18" fill="#060106" stroke="url(#goldAcc)" stroke-width="1.8" />
    
    <!-- Central Void Eye / Glowing Pip -->
    <circle cx="0" cy="0" r="7" fill="#FF145E" />
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
  </g>
</svg>
