<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" width="1024" height="320">
  <defs>
    <!-- Dark lacquer background gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050106" />
      <stop offset="25%" stop-color="#120310" />
      <stop offset="70%" stop-color="#0E020C" />
      <stop offset="100%" stop-color="#050106" />
    </linearGradient>

    <radialGradient id="emblemGlow" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FF145E" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#FF145E" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FF145E" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="facetNeon" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FF3878" />
      <stop offset="55%" stop-color="#FF145E" />
      <stop offset="100%" stop-color="#B80036" />
    </linearGradient>

    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#BA0038" />
      <stop offset="55%" stop-color="#800022" />
      <stop offset="100%" stop-color="#480012" />
    </linearGradient>

    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#E5A100" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="38%" stop-color="#FCE4EC" />
      <stop offset="42%" stop-color="#FF2A6D" />
      <stop offset="100%" stop-color="#FF004E" />
    </linearGradient>

    <!-- Master Petal Unit (scaled for emblem) -->
    <g id="masterPetal">
      <polygon points="-1.5,-44  -54,-88  -92,-145  -44,-208  -1.5,-188" 
               fill="url(#facetDeep)" 
               stroke="#260009" 
               stroke-width="0.8" />
      <polygon points="1.5,-44  54,-88  92,-145  44,-208  1.5,-188" 
               fill="url(#facetNeon)" 
               stroke="#FF598C" 
               stroke-width="0.8" />
      <line x1="0" y1="-44" x2="0" y2="-188" stroke="#FFA3C2" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
      <line x1="-1.5" y1="-44" x2="-44" y2="-208" stroke="#5E0018" stroke-width="0.6" opacity="0.5" />
      <line x1="1.5" y1="-44" x2="44" y2="-208" stroke="#FFC2D6" stroke-width="0.6" opacity="0.5" />
    </g>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="1024" height="320" fill="url(#bannerBg)" />
  <rect x="0" y="0" width="1024" height="320" fill="url(#emblemGlow)" />
  
  <!-- Subtle Top & Bottom Framing Lines -->
  <line x1="0" y1="2" x2="1024" y2="2" stroke="#FF145E" stroke-opacity="0.3" stroke-width="1.5" />
  <line x1="0" y1="318" x2="1024" y2="318" stroke="#FF145E" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- EMBLEM ICON (Left side: center at 180, 160, scale=0.58) -->
  <g transform="translate(180, 160) scale(0.58)">
    <!-- Crest Framing Rings -->
    <circle cx="0" cy="0" r="232" fill="none" stroke="#FF145E" stroke-opacity="0.15" stroke-width="1.2" />
    <circle cx="0" cy="0" r="224" fill="none" stroke="#FF145E" stroke-opacity="0.75" stroke-width="2.5" stroke-dasharray="32 10 6 10" />
    <circle cx="0" cy="0" r="216" fill="none" stroke="#FF145E" stroke-opacity="0.2" stroke-width="1.2" />

    <!-- 5 Petals -->
    <use href="#masterPetal" transform="rotate(0)" />
    <use href="#masterPetal" transform="rotate(72)" />
    <use href="#masterPetal" transform="rotate(144)" />
    <use href="#masterPetal" transform="rotate(216)" />
    <use href="#masterPetal" transform="rotate(288)" />

    <!-- Central Hub -->
    <circle cx="0" cy="0" r="44" fill="#0A020A" stroke="#FF145E" stroke-width="2.5" />
    <circle cx="0" cy="0" r="37" fill="none" stroke="#500015" stroke-width="1.5" />
    <circle cx="0" cy="0" r="28" fill="#180312" stroke="#FF145E" stroke-width="1.5" stroke-opacity="0.85" />
    <circle cx="0" cy="0" r="18" fill="#060106" stroke="url(#goldAcc)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="7" fill="#FF145E" />
    <circle cx="0" cy="0" r="2.8" fill="#FFFFFF" />
  </g>

  <!-- Vertical Hairline Divider -->
  <line x1="340" y1="50" x2="340" y2="270" stroke="#FF145E" stroke-opacity="0.25" stroke-width="1" />
  <line x1="344" y1="75" x2="344" y2="245" stroke="#FFE082" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="6 12" />

  <!-- TYPOGRAPHY (Right side) -->
  <!-- Top Category / Kanji badge -->
  <g transform="translate(370, 85)">
    <!-- Kanji Seal -->
    <rect x="0" y="-18" width="58" height="24" rx="4" fill="#240316" stroke="#FF145E" stroke-width="1" />
    <text x="29" y="-2" font-family="'Noto Sans CJK JP', 'Hiragino Sans', 'Yu Gothic', sans-serif" font-size="13" font-weight="900" fill="#FFE082" text-anchor="middle" letter-spacing="3">黒桜</text>
    
    <text x="74" y="-2" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="12" font-weight="700" fill="#B35B80" letter-spacing="5">EST. 1998 // RETRO ARENA FPS</text>
  </g>

  <!-- Main Title: DARK SAKURA -->
  <g transform="translate(368, 168)">
    <text x="0" y="0" font-family="'Montserrat', 'Impact', 'Trebuchet MS', sans-serif" font-size="74" font-weight="900" letter-spacing="8" fill="url(#textGrad)" stroke="#1A0210" stroke-width="2">DARK SAKURA</text>
  </g>

  <!-- Horizontal divider under title -->
  <line x1="372" y1="195" x2="940" y2="195" stroke="#FF145E" stroke-opacity="0.6" stroke-width="2" />
  <circle cx="372" cy="195" r="3" fill="#FFE082" />

  <!-- Subtitle / Tagline -->
  <g transform="translate(372, 235)">
    <text x="0" y="0" font-family="'Montserrat', 'Trebuchet MS', sans-serif" font-size="15" font-weight="600" fill="#F48FB1" letter-spacing="4">THE PETALS DON'T FALL. THEY HUNT.</text>
  </g>

  <g transform="translate(372, 262)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#FFE082" opacity="0.8" letter-spacing="3">PSX HORROR SURVIVAL // AGY ENGINE</text>
  </g>
</svg>
